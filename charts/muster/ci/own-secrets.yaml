# Every Secret is yours: secrets.generate=false (for tools that render without
# a cluster, like Argo CD), your own GoTrue, store and speech-to-text service.
image:
  tag: 1.2.3
publicUrl: https://muster.example.com
secrets:
  generate: false
auth:
  mode: gotrue
  existingSecret: muster-auth
gotrue:
  url: https://auth.example.com
  existingSecret: muster-gotrue
postgres:
  existingSecret: muster-postgres
connectors:
  enabled: true
  existingSecret: muster-connectors
push:
  enabled: true
  subject: mailto:ops@example.com
  existingSecret: muster-push
attachments:
  enabled: true
  endpoint: https://s3.example.com
  existingSecret: muster-s3
  signingKeySecret: muster-upload-signing
dictation:
  enabled: true
  url: https://stt.example.com
  model: whisper-1
  existingSecret: muster-stt
clientAddress:
  directClients: true
