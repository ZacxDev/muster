# The agent plane with the chart's DEFAULT RBAC: the least-privilege layout and
# its admission policy, neither set here (the RBAC test checks this renders
# least-privilege, so a changed default is caught).
image:
  tag: 1.2.3
publicUrl: https://muster.example.com
agents:
  enabled: true
  gatewayImage:
    repository: registry.example.com/agent-runtime
    tag: "1.0.0"
  claudeCode:
    enabled: true
    image: ghcr.io/zacxdev/claude-code-agent:abc1234
    accounts: [team-a]
    tokensSecret: muster-claude-accounts
