{{- /*
The preview gateway, muster-preview (docs/previews.md#setting-it-up). The
image ships it as /muster-preview. Its variables are the muster-preview table
of docs/configuration.md; every name below is pinned to it by
internal/modulegate/chart_env_test.go. The edge must send *.<domain> here with
Host intact, WebSockets passed and responses unbuffered, and must OVERWRITE
the client-address header the gateway throttles on (docs/previews.md, step 3).
*/ -}}
{{- if .Values.preview.enabled }}
{{- $name := printf "%s-preview" (include "muster.fullname" .) }}
{{- $sel := include "muster.componentSelector" (dict "ctx" . "component" "preview") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
    {{- $sel | nindent 4 }}
spec:
  selector:
    {{- $sel | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-state
  labels:
    {{- include "muster.labels" . | nindent 4 }}
  annotations:
    # Holds the hosts' tunnel tokens (`muster-preview host-token create`).
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.preview.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.preview.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
    {{- $sel | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $sel | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: muster-preview
          image: {{ include "muster.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/muster-preview"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MUSTER_URL
              value: {{ printf "http://%s:%v" (include "muster.svcHost" .) .Values.service.port | quote }}
            - name: MUSTER_PUBLIC_URL
              value: {{ required "publicUrl is required with preview.enabled" .Values.publicUrl | quote }}
            - name: PLUGIN_TOKENS_FILE
              value: /etc/muster-preview/tokens
            - name: PREVIEW_DOMAIN
              value: {{ .Values.preview.domain | quote }}
            - name: PREVIEW_LISTEN
              value: ":8080"
            - name: STATE_DIR
              value: /state
            - name: PREVIEW_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "muster.generatedSecretName" .) .Values.preview.existingSecret }}
                  key: PREVIEW_SIGNING_KEY
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tokens
              mountPath: /etc/muster-preview
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ $name }}-state
        - name: tokens
          secret:
            secretName: {{ required "preview.pluginTokensSecret is required with preview.enabled (a `tokens` key: the viewer plugin token minted on /plugins)" .Values.preview.pluginTokensSecret }}
            items:
              - key: tokens
                path: tokens
{{- if .Values.preview.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
  {{- with .Values.preview.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.preview.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.preview.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ printf "*.%s" .Values.preview.domain | quote }}]
      secretName: {{ .Values.preview.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ printf "*.%s" .Values.preview.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
