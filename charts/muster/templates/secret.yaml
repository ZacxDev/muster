{{- /*
The generated Secret. Every value in it is made once and then read back
from the live object (lookup), so an upgrade keeps it; see values.yaml's
header and docs/kubernetes.md#secrets. `keep`: `helm uninstall` leaves it,
with the Postgres volume, so a reinstall finds both.
*/ -}}
{{- $gen := include "muster.generated" . | fromYaml -}}
{{- if $gen }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "muster.generatedSecretName" . }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k := keys $gen | sortAlpha }}
  {{ $k }}: {{ index $gen $k | toString | b64enc | quote }}
  {{- end }}
{{- end }}
