{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "muster.serviceAccountName" . }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The agent plane reads its own token (the least-privilege layout reads its
# `sub` claim) and calls the API with it; without the plane it is not mounted.
automountServiceAccountToken: {{ .Values.agents.enabled }}
{{- end }}
