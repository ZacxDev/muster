apiVersion: v1
kind: Service
metadata:
  name: {{ include "muster.fullname" . }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
    {{- include "muster.selectorLabels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "muster.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if include "muster.connectOn" . }}
    - name: connect
      port: {{ .Values.service.connectPort }}
      targetPort: connect
    {{- end }}
    {{- if include "muster.gotrueOn" . }}
    - name: browser
      port: {{ .Values.service.browserPort }}
      targetPort: browser
    {{- end }}
