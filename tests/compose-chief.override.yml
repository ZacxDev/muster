# TEST ONLY: the Compose chief's smoke test (tests/compose-up.sh, phase chief).
#
# Adds a fake Anthropic-Messages server and points muster's LLM proxy at it
# (MUSTER_TEST_LLM_UPSTREAM), so the chief's Claude Code CLI runs real turns
# and real muster tool calls with no model and no key. Never use it for a real
# install: every proxied request, with the key muster attaches, goes to the fake.
#
# The fake is on the DEFAULT network, which muster is on and the chief is not:
# the chief can reach it only through muster's proxy, which is what the test
# exercises.
services:
  fake-llm:
    image: python:3.12-alpine
    command: ["python", "/fake/fake_llm.py", "8080"]
    volumes:
      - ${FAKE_LLM_DIR:?set FAKE_LLM_DIR to tests/fake-llm}:/fake:ro
    networks: [default]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 15
  muster:
    environment:
      MUSTER_TEST_LLM_UPSTREAM: http://fake-llm:8080
      MUSTER_TEST_MODE: "1"
    depends_on:
      fake-llm:
        condition: service_healthy
